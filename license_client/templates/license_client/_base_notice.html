{% comment %}
Standalone page: it must render when the rest of the application is unreachable, so it
carries its own styles and depends on no project template, static file or context processor.
{% endcomment %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}Service suspended{% endblock %}</title>
<style>
  :root { color-scheme: light dark; --ink:#1c1c1a; --muted:#5f5e5a; --line:#e2e0d9;
          --page:#f7f6f2; --card:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#f1efe8; --muted:#a8a69e; --line:#33322f; --page:#141412; --card:#1d1d1b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         padding:24px; background:var(--page); color:var(--ink);
         font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
         line-height:1.7; -webkit-font-smoothing:antialiased; }
  .card { width:100%; max-width:520px; background:var(--card); border:1px solid var(--line);
          border-radius:14px; padding:48px 32px; text-align:center; }
  .mark { width:40px; height:40px; margin:0 auto 18px; border:1px solid var(--line);
          border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .mark svg { width:20px; height:20px; stroke:var(--muted); fill:none; stroke-width:1.5;
              stroke-linecap:round; stroke-linejoin:round; }
  h1 { margin:0 0 8px; font-size:20px; font-weight:600; letter-spacing:-0.01em; }
  p { margin:0 0 24px; font-size:15px; color:var(--muted); }
  .contacts { display:inline-block; text-align:left; border-top:1px solid var(--line);
              padding-top:20px; margin-top:4px; font-size:15px; }
  .contacts a { color:inherit; text-decoration:none; border-bottom:1px solid var(--line); }
  .contacts a:hover { border-bottom-color:var(--muted); }
  .row { display:flex; gap:12px; align-items:center; margin-bottom:10px; }
  .row:last-child { margin-bottom:0; }
  .row span.label { color:var(--muted); min-width:74px; font-size:13px; }
  .note { margin:28px 0 0; font-size:13px; color:var(--muted); }
  @media (max-width:480px) { .card { padding:36px 22px; } }
</style>
</head>
<body>
  <main class="card">
    {% block body %}{% endblock %}
  </main>
</body>
</html>
