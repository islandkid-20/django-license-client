# Kept deliberately in step with license-server/ruff.toml. signing.py is duplicated
# byte-for-byte across the two repos and must stay that way — a formatter that
# disagrees between them would break that guarantee silently.
line-length = 88
target-version = "py311"

exclude = [
    "venv",
    ".venv",
    "env",
    "build",
    "dist",
]

[lint.per-file-ignores]
# Declarative Django and DRF class bodies -- Meta.fields, permission_classes,
# list_display -- are framework config, not mutable state. Annotating them with
# ClassVar is noise. Matches the same rule in the licence server's ruff.toml.
"**/models.py" = ["RUF012"]
"**/admin.py" = ["RUF012"]
"**/views.py" = ["RUF012"]
"**/urls.py" = ["RUF012"]
# Tests reach into module internals (_resolve_uncached) on purpose.
"tests/*.py" = ["SLF001"]
